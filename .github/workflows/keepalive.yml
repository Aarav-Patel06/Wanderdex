# Supabase keep-alive (SPEC §18). Free Supabase projects pause after 7 days without activity,
# so this calls the production /api/health, which runs a trivial database query.
#
# Needs, under Settings → Secrets and variables → Actions:
#   - secret   HEALTH_PING_TOKEN: the same value as HEALTH_PING_TOKEN in Vercel
#   - variable SITE_URL:          the production URL, e.g. https://wanderdex.vercel.app
#
# GitHub disables scheduled workflows in public repos after 60 days without repository
# activity. Re-enable it from the Actions tab (see README).
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          HEALTH_PING_TOKEN: ${{ secrets.HEALTH_PING_TOKEN }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$HEALTH_PING_TOKEN" ]; then
            echo "::error::Set the SITE_URL repository variable and the HEALTH_PING_TOKEN secret."
            exit 1
          fi
          # --retry covers timeouts and transient 5xx (e.g. a cold start); any final non-200 fails.
          status=$(curl --silent --show-error --output body.txt --write-out '%{http_code}' \
            --max-time 30 --retry 2 --retry-delay 15 \
            --header "Authorization: Bearer $HEALTH_PING_TOKEN" \
            "${SITE_URL%/}/api/health") || true
          echo "HTTP ${status:-none}: $(cat body.txt 2>/dev/null)"
          if [ "$status" != "200" ]; then
            echo "::error::/api/health answered ${status:-nothing}, expected 200."
            exit 1
          fi
